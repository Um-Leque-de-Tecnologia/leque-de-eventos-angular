<h1>Eventos de tecnologia perto de você</h1>

<section aria-labelledby="tit-proximos">
  <h2 id="tit-proximos">Próximos eventos</h2>
  @if (eventos.error()) {
    <p>Não deu para carregar os próximos eventos agora.</p>
  } @else if (eventos.isLoading()) {
    <p role="status">Carregando os próximos eventos…</p>
  } @else {
    <app-lista-eventos [eventos]="destaques()" />
  }
  <!-- o catálogo saiu daqui: agora ele tem endereço próprio -->
  <p><a class="botao" routerLink="/eventos">Ver todos os eventos</a></p>
</section>

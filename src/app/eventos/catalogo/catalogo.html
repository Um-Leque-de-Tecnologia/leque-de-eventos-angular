<!-- agora é uma página: o título dela é o h1 -->
<h1>Todos os eventos</h1>

<app-filtros-eventos
  [(busca)]="busca"
  [(formato)]="formato"
  [(cidade)]="cidade"
  [cidades]="cidades()"
  [(soGratuitos)]="soGratuitos"
/>

@let lista = visiveis();

<!-- o resumo vira o título da lista: h1 → h2 → h3 dos cards, sem pular nível -->
<h2 aria-live="polite">{{ resumo() }}</h2>

@if (lista.length > 0) {
  <app-lista-eventos [eventos]="lista" />
} @else {
  <app-aviso icone="🔍" acao="Limpar filtros" (agir)="limparFiltros()">
    Nenhum evento com esses filtros. Tente <strong>tirar um deles</strong>.
  </app-aviso>
}
